# Force Railway to use Nixpacks instead of Dockerfile
[build]
builder = "NIXPACKS"

[phases.setup]
# Add system dependencies required for pdf-parse and sharp
nixPkgs = ['nodejs_20', 'cairo', 'pango', 'libjpeg', 'giflib', 'librsvg', 'pixman']

[phases.install]
cmds = ['npm ci']

[phases.build]
cmds = ['npm run prisma:generate', 'npm run build']

[start]
cmd = 'npm run prisma:migrate:deploy && npm run prisma:seed && npm start'
