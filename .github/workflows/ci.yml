name: CI

# Rewritten. The previous version was a leftover from the pre-rewrite codebase and could
# never pass: it targeted `offerlens-backend/` and `offerlens-frontend(new)/`, ran
# `prisma generate` and `prisma migrate deploy` against a project that uses Drizzle, and
# set NEXT_PUBLIC_API_URL for what is now a Vite app. See ADR-003.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  backend:
    name: Backend — typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint:eslint

      # No Postgres or Redis needed: the unit tests are pure functions and the contract
      # test inspects the Fastify route table without serving traffic.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  migrations:
    name: Backend — migration chain applies cleanly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: offerlens_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Guards the drift found in C11: the journal had fallen far behind the schema
      # because the team used db:push while db:migrate went unused. This proves a fresh
      # database can be built from the committed migrations alone.
      - name: Apply migrations from empty
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/offerlens_test

      - name: Seed metadata
        run: npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/offerlens_test

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Advisory only: a new upstream advisory should not block an unrelated PR.
      - name: Audit backend
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit frontend
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
