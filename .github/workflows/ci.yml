name: CI

# Rewritten. The previous version was a leftover from the pre-rewrite codebase and could
# never pass: it targeted `offerlens-backend/` and `offerlens-frontend(new)/`, ran
# `prisma generate` and `prisma migrate deploy` against a project that uses Drizzle, and
# set NEXT_PUBLIC_API_URL for what is now a Vite app. See ADR-003.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  backend:
    name: Backend — typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint:eslint

      # No Postgres or Redis needed: the unit tests are pure functions and the contract
      # test inspects the Fastify route table without serving traffic.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
      # The build rewrites the @/ path aliases (tsc-alias). Loading the compiled app fails with
      # ERR_MODULE_NOT_FOUND if any survive. Imports only: nothing connects, so no services.
      - name: Production build smoke
        run: node -e "import('./dist/src/app.js').then(() => process.exit(0))"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/unused
          JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret-0000
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-not-real-0000

  migrations:
    name: Backend — migration chain applies cleanly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: offerlens_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Guards the drift found in C11: the journal had fallen far behind the schema
      # because the team used db:push while db:migrate went unused. This proves a fresh
      # database can be built from the committed migrations alone.
      - name: Apply migrations from empty
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/offerlens_test

      # The seed and loader scripts import the full config, which exits unless the whole env
      # validates, so they need the two required secrets even though they never use them.
      # Dummy literals, not secrets.
      - name: Seed metadata
        run: npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/offerlens_test
          JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret-0000
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-not-real-0000

      # Proves the committed data/so-2025-india CSV passes the loader validation and the table CHECKs.
      - name: Load salary reference rows
        run: npm run db:load-reference
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/offerlens_test
          JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret-0000
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-not-real-0000

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E — Playwright, mock AI (not blocking yet)
    runs-on: ubuntu-latest
    # Reports without failing the workflow until it has proven stable. Remove this line to make it block.
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        run: npm ci
        working-directory: backend

      - name: Install frontend
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # e2e/stack.mjs starts the containers, migrates, seeds and boots everything. No secrets.
      - name: Run suite
        run: npm run test:e2e

      - name: Keep the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Advisory only: a new upstream advisory should not block an unrelated PR.
      - name: Audit backend
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit frontend
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
