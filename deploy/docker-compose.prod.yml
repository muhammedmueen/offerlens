# OfferLens — production compose for the single shared VPS.
#
# ONE origin: host nginx serves the built frontend and proxies /api/ to this API container
# on 127.0.0.1:8100. Everything here binds to loopback only, because published Docker ports
# BYPASS UFW on this box. Do NOT add a 0.0.0.0 port.
#
# Resource caps use `mem_limit` / `cpus` / `oom_score_adj` — the top-level keys that apply in
# plain `docker compose up` (the `deploy.resources` block is swarm-only and silently ignored
# outside `docker stack`). Verify with:  docker compose -f deploy/docker-compose.prod.yml config
#
# The box has ~3.4 GB free and runs production alongside this, so OfferLens is capped AND is
# the first thing the kernel kills under memory pressure (oom_score_adj raised on every service).
#
# Usage (from the deploy/ directory on the server):
#   docker compose -f docker-compose.prod.yml up -d --build
# Migrations/seed/loaders are NOT run here — see docs/DEPLOY_VPS.md (laptop SSH tunnel +
# docker-compose.migrate.yml).

name: offerlens

services:
  api:
    build: ../backend
    image: offerlens-api
    command: node dist/src/server.js
    env_file: .env.production
    environment:
      NODE_ENV: production
    ports:
      # host-loopback-only -> container 8000. Host nginx proxies /api/ here.
      - '127.0.0.1:8100:8000'
    volumes:
      # Mounted at the container's STORAGE_PATH. `.env.production` MUST set
      # STORAGE_PATH=/app/uploads so the API and workers agree on this path.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.6
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - offerlens

  workers:
    build: ../backend
    image: offerlens-api
    command: node dist/src/workers/index.js
    env_file: .env.production
    environment:
      NODE_ENV: production
    volumes:
      # SAME uploads volume as api, mounted at the SAME path (STORAGE_PATH=/app/uploads):
      # the API writes an upload, the OCR worker reads it.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.4
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - offerlens

  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    environment:
      POSTGRES_USER: offerlens
      POSTGRES_DB: offerlens
      # POSTGRES_PASSWORD comes from .env.production (never hardcode it here).
    # NO published port by default. The migrate override publishes it on loopback for the
    # tunnelled migration step; remove/stop that override afterwards.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U offerlens -d offerlens']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - offerlens

  redis:
    image: redis:7-alpine
    # noeviction: BullMQ requires it (see docs/DEPLOYMENT.md section 1). 96mb leaves headroom
    # under the 128m container cap. appendonly for durability of the queue state.
    command: >
      redis-server
      --maxmemory 96mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - offerlens

# Total cpus budget ~1.0 of the 2 vCPUs (0.6 + 0.4 + 0.5 + 0.25 = 1.75 ceiling, but api+workers
# the hot pair sum to 1.0; postgres/redis are mostly idle). Caps are ceilings, not reservations.

networks:
  offerlens:
    name: offerlens
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads:
