# OfferLens — nginx server block for offerlens.mueens.tech on the shared host.
#
# This host already serves other domains. This file is a SERVER BLOCK ONLY: no default_server,
# no http{}-level directives (gzip/limit_req_zone etc. belong in the main nginx.conf and are not
# duplicated here). Install at /etc/nginx/sites-available/, symlink into sites-enabled/.
#
# TLS is added by certbot. Start from the HTTP-only block below, run:
#   sudo certbot --nginx -d offerlens.mueens.tech
# certbot rewrites `listen 80` to add the 443 block, the ssl_certificate lines and an
# HTTP->HTTPS redirect. The commented block at the bottom shows the final shape it produces.

server {
    listen 80;
    listen [::]:80;
    server_name offerlens.mueens.tech;

    root /var/www/offerlens/dist;
    index index.html;

    access_log /var/log/nginx/offerlens.access.log;
    error_log  /var/log/nginx/offerlens.error.log;

    # Security headers (conservative; no CSP — an untested CSP would break the SPA).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip for text assets on this vhost (safe to repeat per-server).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ── API: one origin, proxied to the loopback-only API container ──────────
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;   # the app accepts ~10 MB uploads; a little headroom
        proxy_read_timeout 90s;

        # Optional per-IP throttle. Needs `limit_req_zone $binary_remote_addr zone=offerlens:10m
        # rate=10r/s;` in the http{} block of the main nginx.conf. Left commented so this file
        # stays server-block-only.
        # limit_req zone=offerlens burst=20 nodelay;
    }

    # ── Datasets served statically (attribution links resolve here) ─────────
    location /datasets/ {
        alias /var/www/offerlens/datasets/;
        autoindex off;               # no directory listing
        # Serve the source files as readable text, not downloads.
        types {
            text/markdown md;
            text/x-python py;
            text/csv      csv;
            application/json json;
        }
        default_type text/plain;
    }

    # ── Static SPA: hashed assets cached hard, index.html never cached ──────
    # nginx `add_header` does NOT merge across contexts: any location with its own
    # add_header drops the server-level ones. The SPA document (served here via the
    # try_files redirect to /index.html) and the JS bundles must still carry the three
    # security headers, so repeat them in every block that adds a Cache-Control header.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed files under /assets/.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Final TLS shape (what `certbot --nginx` produces; shown for reference) ──
# After certbot runs, the block above gains the managed TLS lines and a redirect server is
# added. You should NOT need to hand-edit this; it is here so you can confirm the result:
#
