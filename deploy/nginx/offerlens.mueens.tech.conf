#     server_name offerlens.mueens.tech;
#     root /var/www/offerlens/dist;
#     # ... all the location blocks above, unchanged ...
#
#     listen [::]:443 ssl ipv6only=on; # managed by Certbot
#     listen 443 ssl; # managed by Certbot
#     ssl_certificate /etc/letsencrypt/live/offerlens.mueens.tech/fullchain.pem; # managed by Certbot
#     ssl_certificate_key /etc/letsencrypt/live/offerlens.mueens.tech/privkey.pem; # managed by Certbot
#     include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
# }
