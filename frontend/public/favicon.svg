<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OfferLens lens mark">
  <!-- The lens mark from the identity (spec §8): a cyan-700 ring + short diagonal handle,
       the offerlens glass as drawn in the hero wordmark. Warm-paper ground, no fine detail,
       so it stays crisp and legible at 16px. One accent only; no gradient. -->
  <rect width="32" height="32" rx="7" fill="#FBFAF7"/>
  <circle cx="14" cy="14" r="7.5" fill="none" stroke="#0E7490" stroke-width="3"/>
  <line x1="19.5" y1="19.5" x2="25" y2="25" stroke="#0E7490" stroke-width="3" stroke-linecap="round"/>
</svg>
